// ── Helpers ────────────────────────────────────────────────────────────────
function applyTheme(t) { Object.entries(THEMES[t].vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v)); }
function uid() { return "i"+Date.now()+Math.random().toString(36).slice(2,6); }
function validUrl(u) { try{return !!new URL(u.startsWith("http")?u:"https://"+u).hostname;}catch{return false;} }
function normUrl(u) { return u.startsWith("http")?u:"https://"+u; }
function getColor(link, tk) { return (link.colors&&link.colors[tk])||link.color||DEFAULT_COLOR; }
function purgeLink(items, id) {
  return items.filter(it=>!(it.type==="button"&&it.linkId===id)).map(it=>it.items?{...it,items:purgeLink(it.items,id)}:it);
}
function filterItems(items, q, getLink) {
  if (!q) return items;
  const out=[];
  for (const it of items) {
    if (it.type==="button"){const l=getLink(it.linkId);if(l&&l.label.toLowerCase().includes(q))out.push(it);}
    else if (it.type==="folder"){const kids=filterItems(it.items,q,getLink);if(kids.length)out.push({...it,items:kids});}
  }
  return out;
}
function migrateLink(l) {
  if (l.colors) return l;
  const c=l.color||DEFAULT_COLOR;
  return {...l,colors:Object.fromEntries(THEME_KEYS.map(k=>[k,c]))};
}

// ── Firebase Auth REST ─────────────────────────────────────────────────────
function getCfg() { try{return JSON.parse(localStorage.getItem(FB_CONFIG_KEY)||"{}");}catch{return {};} }

async function fbRequest(endpoint, body) {
  const {apiKey}=getCfg();
  const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${endpoint}?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,returnSecureToken:true}),
  });
  const d=await res.json();
  if(!res.ok) throw {code:d?.error?.message||"ERROR",message:d?.error?.message||"Errore"};
  return d;
}
async function fbSignIn(email,pw) {
  const d=await fbRequest("signInWithPassword",{email,password:pw});
  const user={email:d.email,uid:d.localId,idToken:d.idToken,refreshToken:d.refreshToken,expiresAt:Date.now()+d.expiresIn*1000};
  localStorage.setItem(FB_TOKEN_KEY,d.refreshToken);
  localStorage.setItem(FB_USER_KEY,JSON.stringify({email:d.email,uid:d.localId}));
  return user;
}
async function fbRegister(email,pw) {
  const d=await fbRequest("signUp",{email,password:pw});
  const user={email:d.email,uid:d.localId,idToken:d.idToken,refreshToken:d.refreshToken,expiresAt:Date.now()+d.expiresIn*1000};
  localStorage.setItem(FB_TOKEN_KEY,d.refreshToken);
  localStorage.setItem(FB_USER_KEY,JSON.stringify({email:d.email,uid:d.localId}));
  return user;
}
async function fbRefreshToken(refreshToken) {
  const {apiKey}=getCfg();
  const res=await fetch(`https://securetoken.googleapis.com/v1/token?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({grant_type:"refresh_token",refresh_token:refreshToken}),
  });
  if(!res.ok){fbSignOutLocal();return null;}
  const d=await res.json();
  localStorage.setItem(FB_TOKEN_KEY,d.refresh_token);
  return {idToken:d.id_token,refreshToken:d.refresh_token,expiresAt:Date.now()+d.expires_in*1000};
}
async function fbRestoreSession() {
  const rt=localStorage.getItem(FB_TOKEN_KEY);
  const su=localStorage.getItem(FB_USER_KEY);
  if(!rt||!su) return null;
  const tokens=await fbRefreshToken(rt);
  if(!tokens) return null;
  return {...JSON.parse(su),...tokens};
}
function fbSignOutLocal(){localStorage.removeItem(FB_TOKEN_KEY);localStorage.removeItem(FB_USER_KEY);}
function mapAuthError(code) {
  if(!code) return "Errore sconosciuto.";
  if(code.includes("EMAIL_NOT_FOUND")||code.includes("INVALID_PASSWORD")||code.includes("INVALID_LOGIN_CREDENTIALS")) return "Email o password non corretti.";
  if(code.includes("EMAIL_EXISTS")) return "Email già registrata.";
  if(code.includes("INVALID_EMAIL")) return "Email non valida.";
  if(code.includes("WEAK_PASSWORD")) return "Password troppo debole (min. 6 caratteri).";
  if(code.includes("TOO_MANY_ATTEMPTS")) return "Troppi tentativi. Riprova più tardi.";
  return code;
}

// ── Firestore REST ─────────────────────────────────────────────────────────
function fsUrl(uid) {
  const {projectId}=getCfg();
  return `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/users/${uid}`;
}

async function getValidToken(user, onRefresh) {
  if (user.expiresAt && Date.now() > user.expiresAt - 120000) {
    const tokens = await fbRefreshToken(user.refreshToken);
    if (tokens) { onRefresh(tokens); return tokens.idToken; }
  }
  return user.idToken;
}

async function fsLoad(user, onRefresh) {
  const token = await getValidToken(user, onRefresh);
  const res = await fetch(fsUrl(user.uid), {headers:{Authorization:`Bearer ${token}`}});
  if (res.status===404) return null;
  if (!res.ok) throw new Error("Firestore load error: "+res.status);
  const doc = await res.json();
  const raw = doc.fields?.data?.stringValue;
  return raw ? JSON.parse(raw) : null;
}

async function fsSave(user, onRefresh, data) {
  const token = await getValidToken(user, onRefresh);
  const res = await fetch(fsUrl(user.uid)+"?updateMask.fieldPaths=data", {
    method:"PATCH",
    headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
    body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(data)}}}),
  });
  if (!res.ok) throw new Error("Firestore save error: "+res.status);
}

// ── Drag & Drop ────────────────────────────────────────────────────────────
function useDragList(items, onUpdate) {
  const dragIdx=useRef(null);
  const [overIdx,setOverIdx]=useState(null);
  function onDragStart(e,i){dragIdx.current=i;e.dataTransfer.effectAllowed="move";}
  function onDragOver(e,i){e.preventDefault();if(dragIdx.current!==null&&i!==dragIdx.current)setOverIdx(i);}
  function onDrop(e,i){
    e.preventDefault();const from=dragIdx.current;
    if(from===null||from===i){dragIdx.current=null;setOverIdx(null);return;}
    const a=[...items];const[r]=a.splice(from,1);a.splice(i,0,r);
    onUpdate(a);dragIdx.current=null;setOverIdx(null);
  }
  function onDragEnd(){dragIdx.current=null;setOverIdx(null);}
  return{dragProps:i=>({draggable:true,onDragStart:e=>onDragStart(e,i),onDragOver:e=>onDragOver(e,i),onDrop:e=>onDrop(e,i),onDragEnd,className_dragging:dragIdx.current===i,className_over:overIdx===i&&dragIdx.current!==i})};
}

  const [layout,setLayout]          = useState(seedLayout);
  const [recent,setRecent]          = useState([]);
  const [dataLoaded,setDataLoaded]  = useState(false);
  const [syncState,setSyncState]    = useState("ok"); // ok | saving | err
  const [modal,setModal]            = useState(null);
  const [form,setForm]              = useState({label:"",url:"",colors:Object.fromEntries(THEME_KEYS.map(k=>[k,DEFAULT_COLOR])),editTheme:"light"});
  const [formErr,setFormErr]        = useState({});
  const [confirm,setConfirm]        = useState(null);
  const [toast,setToast]            = useState(null);
  const saveTimer                   = useRef(null);

  // ── refresh token helper ──
  function onTokenRefresh(tokens) { setUser(u=>({...u,...tokens})); }

  // ── load from Firestore on mount ──
  useEffect(()=>{
    applyTheme(theme);
    fsLoad(user, onTokenRefresh).then(data=>{
      if (data) {
        if (data.links)  setLinks(data.links.map(migrateLink));
        if (data.layout) setLayout(data.layout);
        if (data.recent) setRecent(data.recent);
        if (data.theme && THEMES[data.theme]) {
          setThemeKey(data.theme);
          applyTheme(data.theme);
        }
      }
      setDataLoaded(true);
    }).catch(e=>{
      console.warn("Firestore load error:", e);
      setDataLoaded(true);
    });
  },[]);

  // ── save to Firestore (debounced 1.5s) ──
  useEffect(()=>{
    if (!dataLoaded) return;
    setSyncState("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      fsSave(user, onTokenRefresh, {links,layout,recent,theme})
        .then(()=>setSyncState("ok"))
        .catch(e=>{console.warn("Firestore save error:",e);setSyncState("err");});
    }, 1500);
    return ()=>clearTimeout(saveTimer.current);
  },[links,layout,recent,theme,dataLoaded]);

  // ── theme ──
  useEffect(()=>{ applyTheme(theme); localStorage.setItem(THEME_KEY,theme); },[theme]);
  useEffect(()=>{ if(!toast)return;const t=setTimeout(()=>setToast(null),2000);return()=>clearTimeout(t); },[toast]);

  function startEditLink(l){ setForm({label:l.label,url:l.url,colors:{...l.colors},editTheme:theme});setFormErr({});setModal({type:"editLink",link:l}); }
  function saveLink(){
    const e={};
    if(!form.label.trim()) e.label="Nome obbligatorio";

    const url=normUrl(form.url);
    if(modal.type==="addLink"){setLinks(p=>[...p,{id:Date.now(),label:form.label,url,colors:form.colors}]);setToast("✓ Link aggiunto");}
    else{setLinks(p=>p.map(l=>l.id===modal.link.id?{...l,label:form.label,url,colors:form.colors}:l));setToast("✓ Link aggiornato");}
    setModal(null);
  }
  function doDeleteLink(id){
    setLinks(p=>p.filter(l=>l.id!==id));
    setLayout(p=>p.map(sec=>({...sec,items:purgeLink(sec.items,id)})));
    setRecent(p=>p.filter(r=>r!==id));
    setConfirm(null);setToast("Link eliminato");
  }
  function openPicker(cb){setModal({type:"pick",cb});}
  function openFolderName(cb,init){setModal({type:"name",cb,init:init||"",label:"cartella"});}
  function openSectionName(cb,init){setModal({type:"name",cb,init:init||"",label:"sezione"});}
  const getLink=id=>links.find(l=>l.id===id);

  const syncTitle = syncState==="ok"?"Dati sincronizzati":syncState==="saving"?"Salvataggio...":"Errore sincronizzazione";

  if (!dataLoaded) return (
    <div className="loading-screen"><style>{CSS}</style><div className="spinner"/><span style={{fontSize:14,color:"var(--text3)"}}>Caricamento dati...</span></div>
  );

  return <>
    <style>{CSS}</style>
    <header className="header">
      <div className="header-top">
        <span className="header-logo">🔗</span>
        <span className="header-title">All My Utils</span>
        <div className={`sync-dot ${syncState}`} title={syncTitle}/>
        <span className="user-chip" title={user?.email}>{user?.email}</span>
        <button className="logout-btn" onClick={onLogout}>Esci</button>
        <select className="theme-select" value={theme} onChange={e=>setThemeKey(e.target.value)}>
          {Object.entries(THEMES).map(([k,t])=><option key={k} value={k}>{t.label}</option>)}
        </select>
      </div>
      <nav className="header-tabs">
        <button className={`header-tab${tab==="home"?" active":""}`} onClick={()=>setTab("home")}>🏠 Home</button>
        <button className={`header-tab${tab==="settings"?" active":""}`} onClick={()=>setTab("settings")}>⚙️ Impostazioni</button>
      </nav>
    </header>
    <main className="body">
      {tab==="home"&&<HomeView layout={layout}getLink={getLink}theme={theme}recent={recent}onOpen={handleOpen}/>}
      {tab==="settings"&&<>
        <div className="subtabs">
          <button className={`subtab${settingsTab==="links"?" active":""}`}onClick={()=>setSettingsTab("links")}>🔗 Link</button>
          <button className={`subtab${settingsTab==="editor"?" active":""}`}onClick={()=>setSettingsTab("editor")}>🎨 Home Editor</button>
        </div>
        {settingsTab==="links"&&<>
          <button className="btn-add-lnk"onClick={startAddLink}>+ Aggiungi Link</button>
          {links.length===0?<div className="empty"><p>Nessun link.</p></div>
            :<div className="settings-list">{links.map(l=><div key={l.id}className="settings-item">
              <div className="settings-dot"style={{background:getColor(l,theme)}}/>
              <div className="settings-info"><div className="settings-name">{l.label}</div><div className="settings-url">{l.url}</div></div>
              <div className="settings-actions">
                <button className="icon-btn"title="Modifica"onClick={()=>startEditLink(l)}>✏️</button>
                <button className="icon-btn danger"title="Elimina"onClick={()=>setConfirm({type:"link",id:l.id})}>🗑️</button>
              </div>
            </div>)}</div>}
        </>}
        {settingsTab==="editor"&&<HomeEditor layout={layout}onUpdate={setLayout}getLink={getLink}openPicker={openPicker}openFolderName={openFolderName}openSectionName={openSectionName}/>}
      </>}
    </main>
    {(modal?.type==="addLink"||modal?.type==="editLink")&&<div className="overlay"onClick={()=>setModal(null)}><div className="modal"onClick={e=>e.stopPropagation()}>
      <h2>{modal.type==="addLink"?"➕ Nuovo Link":"✏️ Modifica Link"}</h2>
      <div className="field"><label>Nome</label>
        <input value={form.label}placeholder="es. Google"onChange={e=>{setForm(f=>({...f,label:e.target.value}));setFormErr(er=>({...er,label:null}));}}/>
        {formErr.label&&<div className="field-err">{formErr.label}</div>}
      </div>
      <div className="field"><label>URL</label>
        <input value={form.url}placeholder="https://..."onChange={e=>{setForm(f=>({...f,url:e.target.value}));setFormErr(er=>({...er,url:null}));}}/>
        {formErr.url&&<div className="field-err">{formErr.url}</div>}
      </div>
      <div className="field"><label>Colore per tema</label>
        <div className="theme-tabs">{THEME_KEYS.map(k=><button key={k}className={`theme-tab${form.editTheme===k?" active":""}`}onClick={()=>setForm(f=>({...f,editTheme:k}))}>{THEMES[k].label}</button>)}</div>
        <div className="color-row">{COLORS.map(c=><button key={c}className={`color-swatch${form.colors[form.editTheme]===c?" selected":""}`}style={{background:c}}onClick={()=>setForm(f=>({...f,colors:{...f.colors,[f.editTheme]:c}}))}/>)}</div>
      </div>
      <div className="field"><label>Anteprima — {THEMES[form.editTheme].label}</label>
        <div style={{paddingTop:6}}><span className="preview-btn"style={{background:form.colors[form.editTheme],boxShadow:`0 2px 8px ${form.colors[form.editTheme]}44`}}>{form.label||"Nome link"}</span></div>
      </div>
      <div className="mfooter"><button className="btn-cancel"onClick={()=>setModal(null)}>Annulla</button>
        <button className="btn-save"style={{background:form.colors[theme]||DEFAULT_COLOR}}onClick={saveLink}>{modal.type==="addLink"?"Aggiungi":"Salva"}</button>
      </div>
    </div></div>}
    {modal?.type==="pick"&&<div className="overlay"onClick={()=>setModal(null)}><div className="modal"onClick={e=>e.stopPropagation()}>
      <h2>➕ Scegli pulsante</h2>
      {links.length===0?<p style={{color:"var(--text4)",fontSize:14,marginBottom:16}}>Nessun link. Creane uno prima.</p>
        :<div className="pick-list">{links.map(l=>{const c=getColor(l,theme);return<div key={l.id}className="pick-item"onClick={()=>{modal.cb(l.id);setModal(null);setToast("✓ Pulsante aggiunto");}}>
          <div style={{width:26,height:26,borderRadius:6,background:c,flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{l.label}</div><div style={{fontSize:11,color:"var(--text4)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.url}</div></div>
          <span style={{fontSize:16,color:"var(--accent)"}}>＋</span>
        </div>;})}
        </div>}
      <div className="mfooter"><button className="btn-cancel"onClick={()=>setModal(null)}>Chiudi</button></div>
    </div></div>}
    {modal?.type==="name"&&<NameModal label={modal.label}initial={modal.init}onSave={n=>{modal.cb(n);setModal(null);setToast("✓ Salvato");}}onClose={()=>setModal(null)}/>}
    {confirm&&<div className="overlay"onClick={()=>setConfirm(null)}><div className="confirm-box"onClick={e=>e.stopPropagation()}>
      <div style={{fontSize:38,marginBottom:10}}>🗑️</div><h3>Eliminare?</h3><p>Azione irreversibile.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center"}}>
        <button className="btn-cancel"onClick={()=>setConfirm(null)}>Annulla</button>
        <button className="btn-save"style={{background:"#e74c3c"}}onClick={()=>confirm.type==="link"&&doDeleteLink(confirm.id)}>Elimina</button>
      </div>
    </div></div>}
    {toast&&<div className="toast">{toast}</div>}
  </>;
}

// ── AppRoot ────────────────────────────────────────────────────────────────
function AppRoot() {
  const [state,setState] = useState("loading");
  const [user,setUser]   = useState(null);

  useEffect(()=>{
    const t=localStorage.getItem(THEME_KEY)||"light";
    applyTheme(THEMES[t]?t:"light");
    const cfg=localStorage.getItem(FB_CONFIG_KEY);
    if(!cfg||!JSON.parse(cfg).apiKey||!JSON.parse(cfg).projectId){setState("setup");return;}
    fbRestoreSession().then(u=>{if(u){setUser(u);setState("app");}else setState("auth");}).catch(()=>setState("auth"));
  },[]);

  if (state==="loading") return <div className="loading-screen"><style>{CSS}</style><div className="spinner"/></div>;
  if (state==="setup")   return <><style>{CSS}</style><FirebaseSetup onDone={()=>setState("auth")}/></>;
  if (state==="auth")    return <><style>{CSS}</style><AuthScreen onUser={u=>{setUser(u);setState("app");}}/></>;
  return <MainApp user={user} setUser={setUser} onLogout={()=>{fbSignOutLocal();setUser(null);setState("auth");}}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot/>);
  </script>
</body>
</html>
